<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeLlevo — Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0A1628;
      --surface:   #0D1F3C;
      --surface-2: #112240;
      --border:    #1B3A6B;
      --gold:      #C9A84C;
      --gold-b:    #F0C040;
      --gold-p:    #F5DFA0;
      --text:      #E8EAF0;
      --muted:     #8892A4;
      --pending:   #F5A623;
      --confirmed: #4A9EFF;
      --completed: #48BB78;
      --cancelled: #FC8181;
      --radius:    10px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; }

    /* ── Login ── */
    .login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #1B3A6B22 0%, transparent 60%), var(--bg);
    }
    .login-card {
      width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 40px 32px; position: relative; overflow: hidden;
    }
    .login-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #C9A84C, #F0C040, #C9A84C);
    }
    .login-logo { font-size: 1.6rem; font-weight: 700; color: var(--gold); margin-bottom: 8px; letter-spacing: -.02em; }
    .login-title { font-size: .95rem; color: var(--muted); margin-bottom: 28px; }
    .login-form { display: flex; flex-direction: column; gap: 16px; }
    .field label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    .field input {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; color: var(--text); font-size: .95rem; outline: none; transition: border-color .2s;
    }
    .field input:focus { border-color: var(--gold); }
    .login-error { color: var(--cancelled); font-size: .85rem; padding: 10px 14px; background: rgba(252,129,129,.1); border-radius: 8px; border: 1px solid rgba(252,129,129,.3); }
    .btn-primary {
      background: linear-gradient(135deg, #C9A84C, #F0C040, #C9A84C); color: #0A1628;
      font-weight: 700; font-size: .95rem; border: none; border-radius: 8px; padding: 11px 20px;
      cursor: pointer; transition: opacity .2s, transform .15s;
    }
    .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-secondary {
      background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 16px; font-size: .88rem; font-weight: 500; cursor: pointer; transition: border-color .2s, color .2s;
    }
    .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }
    .btn-danger {
      background: transparent; color: var(--cancelled); border: 1px solid rgba(252,129,129,.4);
      border-radius: 8px; padding: 9px 16px; font-size: .88rem; cursor: pointer; transition: background .2s;
    }
    .btn-danger:hover { background: rgba(252,129,129,.1); }

    /* ── App shell ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; gap: 16px; padding: 0 20px; height: 58px;
      background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
    }
    .header__brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .header__logo { color: var(--gold); font-size: 1.2rem; }
    .header__title { font-weight: 700; font-size: .95rem; color: var(--text); white-space: nowrap; }
    .header__nav { display: flex; gap: 4px; flex: 1; }
    .header__nav-btn {
      background: transparent; border: none; color: var(--muted); font-size: .88rem; font-weight: 500;
      padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: background .2s, color .2s;
    }
    .header__nav-btn:hover { color: var(--text); background: rgba(255,255,255,.05); }
    .header__nav-btn.active { background: rgba(201,168,76,.15); color: var(--gold); }
    .header__logout {
      background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 6px;
      border-radius: 6px; display: flex; align-items: center; transition: color .2s;
    }
    .header__logout:hover { color: var(--cancelled); }

    /* ── Views ── */
    .view { flex: 1; padding: 20px; max-width: 900px; width: 100%; margin: 0 auto; }

    /* ── Status tabs ── */
    .status-tabs { display: flex; gap: 6px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
    .status-tab {
      display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); font-size: .85rem; font-weight: 500; padding: 7px 14px; border-radius: 20px;
      cursor: pointer; white-space: nowrap; transition: all .2s; flex-shrink: 0;
    }
    .status-tab:hover { border-color: var(--gold); color: var(--text); }
    .status-tab.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,.1); }
    .badge {
      background: var(--border); color: var(--text); font-size: .75rem; font-weight: 700;
      padding: 1px 7px; border-radius: 10px; min-width: 20px; text-align: center;
    }
    .status-tab.active .badge { background: var(--gold); color: #0A1628; }

    /* ── Reservation cards ── */
    .reservations-list { display: flex; flex-direction: column; gap: 10px; }
    .res-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 18px; cursor: pointer; transition: border-color .2s, transform .15s;
      display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start;
    }
    .res-card:hover { border-color: var(--gold); transform: translateY(-1px); }
    .res-card__name { font-weight: 600; font-size: .95rem; }
    .res-card__datetime { font-size: .82rem; color: var(--muted); margin-top: 2px; }
    .res-card__route {
      font-size: .82rem; color: var(--muted); margin-top: 6px; grid-column: 1; display: flex; align-items: center; gap: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .res-card__route-arrow { color: var(--gold); flex-shrink: 0; }
    .res-card__driver { font-size: .78rem; color: var(--confirmed); margin-top: 4px; grid-column: 1; }
    .res-card__right { grid-row: 1 / 3; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .status-badge {
      font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 12px; text-transform: uppercase; letter-spacing: .04em;
    }
    .status-badge--pending   { background: rgba(245,166,35,.15);  color: var(--pending); }
    .status-badge--confirmed { background: rgba(74,158,255,.15); color: var(--confirmed); }
    .status-badge--completed { background: rgba(72,187,120,.15); color: var(--completed); }
    .status-badge--cancelled { background: rgba(252,129,129,.15); color: var(--cancelled); }
    .res-card__price { font-size: .88rem; font-weight: 700; color: var(--gold); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state svg { margin-bottom: 12px; opacity: .3; }

    /* ── Detail panel ── */
    .detail-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; opacity: 0;
      transition: opacity .3s; pointer-events: none;
    }
    .detail-overlay.open { opacity: 1; pointer-events: all; }
    .detail-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 460px; z-index: 201;
      background: var(--surface); border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .detail-panel.open { transform: translateX(0); }
    .detail-panel__header {
      display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .detail-close {
      background: transparent; border: none; color: var(--muted); cursor: pointer; display: flex;
      align-items: center; gap: 6px; font-size: .88rem; padding: 4px 8px; border-radius: 6px; transition: color .2s;
    }
    .detail-close:hover { color: var(--text); }
    .detail-body { flex: 1; overflow-y: auto; padding: 20px 18px; }
    .detail-section { margin-bottom: 20px; }
    .detail-section__title { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px; }
    .detail-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.04); font-size: .88rem; gap: 12px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-row__label { color: var(--muted); flex-shrink: 0; }
    .detail-row__value { color: var(--text); text-align: right; word-break: break-word; }
    .detail-row__value--gold { color: var(--gold); font-weight: 700; }
    .detail-header-info { margin-bottom: 20px; }
    .detail-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .detail-meta { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .detail-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
    .detail-actions .row { display: flex; gap: 10px; }
    .detail-actions .row > * { flex: 1; }
    .driver-select {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 14px; color: var(--text); font-size: .9rem; outline: none; cursor: pointer;
    }
    .driver-select:focus { border-color: var(--gold); }
    .action-label { font-size: .78rem; color: var(--muted); margin-bottom: 5px; }

    /* ── Drivers view ── */
    .view-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .view-header h2 { font-size: 1.1rem; font-weight: 700; }
    .add-driver-form { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .add-driver-form input {
      flex: 1; min-width: 160px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 14px; color: var(--text); font-size: .9rem; outline: none; transition: border-color .2s;
    }
    .add-driver-form input:focus { border-color: var(--gold); }
    .drivers-list { display: flex; flex-direction: column; gap: 8px; }
    .driver-item {
      display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
    }
    .driver-avatar {
      width: 38px; height: 38px; border-radius: 50%; background: rgba(201,168,76,.15); border: 1px solid rgba(201,168,76,.3);
      display: flex; align-items: center; justify-content: center; color: var(--gold); font-weight: 700; font-size: .95rem; flex-shrink: 0;
    }
    .driver-info { flex: 1; }
    .driver-name { font-weight: 600; font-size: .9rem; }
    .driver-phone { font-size: .8rem; color: var(--muted); }
    .driver-toggle {
      background: transparent; border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px;
      font-size: .78rem; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .driver-toggle--active { border-color: var(--completed); color: var(--completed); }
    .driver-toggle--inactive { border-color: var(--border); color: var(--muted); }
    .driver-delete { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 6px; transition: color .2s; }
    .driver-delete:hover { color: var(--cancelled); }

    /* ── Misc ── */
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(201,168,76,.2); border-top-color: var(--gold); border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-center { display: flex; justify-content: center; padding: 60px; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 520px) {
      .detail-panel { max-width: 100%; }
      .add-driver-form { flex-direction: column; }
      .res-card__route { max-width: 200px; }
    }
  </style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">✦ TeLlevo</div>
    <p class="login-title">Panel de administración</p>
    <form id="login-form" class="login-form" novalidate>
      <div class="field">
        <label for="login-email">Correo</label>
        <input type="email" id="login-email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="login-pwd">Contraseña</label>
        <input type="password" id="login-pwd" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="login-error" hidden></p>
      <button type="submit" id="login-btn" class="btn-primary">Ingresar</button>
    </form>
  </div>
</div>

<!-- ── App ── -->
<div id="app" hidden>
  <header class="header">
    <div class="header__brand">
      <span class="header__logo">✦</span>
      <span class="header__title">TeLlevo Admin</span>
    </div>
    <nav class="header__nav">
      <button class="header__nav-btn active" data-view="reservations">Reservas</button>
      <button class="header__nav-btn" data-view="drivers">Choferes</button>
    </nav>
    <button class="header__logout" id="logout-btn" title="Cerrar sesión">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>

  <!-- Reservas -->
  <main id="view-reservations" class="view">
    <div class="status-tabs">
      <button class="status-tab active" data-status="pending">Pendientes <span class="badge" id="badge-pending">0</span></button>
      <button class="status-tab" data-status="confirmed">Confirmadas <span class="badge" id="badge-confirmed">0</span></button>
      <button class="status-tab" data-status="completed">Completadas <span class="badge" id="badge-completed">0</span></button>
      <button class="status-tab" data-status="cancelled">Canceladas <span class="badge" id="badge-cancelled">0</span></button>
    </div>
    <div id="reservations-list">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </main>

  <!-- Choferes -->
  <main id="view-drivers" class="view" hidden>
    <div class="view-header">
      <h2>Choferes</h2>
    </div>
    <form id="add-driver-form" class="add-driver-form" novalidate>
      <input type="text" id="driver-name-input" placeholder="Nombre del chofer" required>
      <input type="tel" id="driver-phone-input" placeholder="+56 9 1234 5678">
      <button type="submit" class="btn-primary">Agregar chofer</button>
    </form>
    <div id="drivers-list">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<!-- ── Detail panel ── -->
<div id="detail-overlay" class="detail-overlay"></div>
<aside id="detail-panel" class="detail-panel" aria-label="Detalle de reserva">
  <div class="detail-panel__header">
    <button id="detail-close" class="detail-close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 5 5 12 12 19"/></svg>
      Volver
    </button>
  </div>
  <div id="detail-body" class="detail-body"></div>
</aside>

<script type="module">
import { initializeApp }          from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js';
import { getFirestore, collection, query, orderBy, onSnapshot,
         doc, updateDoc, addDoc, deleteDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js';

// ── Firebase init ──────────────────────────────────────────────────────────
const app  = initializeApp({
  apiKey:            '%%FIREBASE_API_KEY%%',
  authDomain:        '%%FIREBASE_AUTH_DOMAIN%%',
  projectId:         '%%FIREBASE_PROJECT_ID%%',
  appId:             '%%FIREBASE_APP_ID%%',
  messagingSenderId: '%%FIREBASE_MESSAGING_SENDER_ID%%',
});
const auth = getAuth(app);
const db   = getFirestore(app);

// ── State ──────────────────────────────────────────────────────────────────
let currentStatus    = 'pending';
let reservations     = {};    // { id: data }
let drivers          = {};    // { id: data }
let selectedId       = null;
let unsubReservations = null;
let unsubDrivers      = null;

// ── Helpers ────────────────────────────────────────────────────────────────
const fmt = (n) => n != null ? new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(n) : '—';

const fmtDate = (fecha, hora) => {
  if (!fecha) return '—';
  const d = new Date(fecha + 'T12:00:00');
  const day = d.toLocaleDateString('es-CL', { weekday: 'short', day: 'numeric', month: 'short' });
  return hora ? `${day} · ${hora}` : day;
};

const statusLabel = { pending: 'Pendiente', confirmed: 'Confirmada', completed: 'Completada', cancelled: 'Cancelada' };

const el  = (id) => document.getElementById(id);
const $ = (sel, ctx = document) => ctx.querySelector(sel);

// ── Auth — solo REST API, sin depender del SDK de Firebase Auth ────────────
// El SDK de Firebase Auth se cuelga en este entorno; usamos la REST API directamente.
// onAuthStateChanged se registra solo para limpiar sesiones cacheadas antiguas.
onAuthStateChanged(auth, (user) => {
  if (window._restMode) return; // REST mode activo — ignorar SDK
  if (user) {
    // Hay sesión cacheada del SDK — cerrarla para forzar login limpio vía REST
    signOut(auth).catch(() => {});
  }
  // Siempre mostrar login screen al cargar (no auto-login via SDK)
  el('login-screen').hidden = false;
  el('app').hidden = true;
});

el('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn    = el('login-btn');
  const errEl  = el('login-error');
  btn.disabled = true;
  btn.textContent = 'Ingresando…';
  errEl.hidden = true;
  try {
    const r = await fetch(
      `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${firebaseConfig.apiKey}`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: el('login-email').value.trim(), password: el('login-pwd').value, returnSecureToken: true }) }
    );
    const data = await r.json();
    if (!r.ok) throw new Error(data.error?.message || 'Credenciales inválidas');
    window._fbToken = data.idToken;
    el('login-screen').hidden = true;
    el('app').hidden = false;
    startListenersREST(data.idToken);
  } catch (err) {
    errEl.textContent = err.message === 'INVALID_LOGIN_CREDENTIALS' ? 'Email o contraseña incorrectos' : (err.message || 'Error al iniciar sesión');
    errEl.hidden = false;
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
});

el('logout-btn').addEventListener('click', () => {
  window._restMode = false;
  window._fbToken  = null;
  if (_restPoll) { clearInterval(_restPoll); _restPoll = null; }
  stopListeners();
  el('login-screen').hidden = false;
  el('app').hidden = true;
  signOut(auth).catch(() => {}); // intentar limpiar sesión SDK en segundo plano
});

// ── Nav ────────────────────────────────────────────────────────────────────
document.querySelectorAll('.header__nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.header__nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    el('view-reservations').hidden = view !== 'reservations';
    el('view-drivers').hidden      = view !== 'drivers';
  });
});

// ── Firestore REST helpers (fallback when SDK auth hangs) ─────────────────
function _fsDocToObj(doc) {
  const id = (doc.name || '').split('/').pop();
  const obj = { id };
  function parseVal(v) {
    if ('stringValue'    in v) return v.stringValue;
    if ('integerValue'   in v) return parseInt(v.integerValue);
    if ('doubleValue'    in v) return v.doubleValue;
    if ('booleanValue'   in v) return v.booleanValue;
    if ('nullValue'      in v) return null;
    if ('timestampValue' in v) return new Date(v.timestampValue);
    if ('mapValue'       in v) {
      const m = {};
      for (const [k2, v2] of Object.entries(v.mapValue.fields || {})) m[k2] = parseVal(v2);
      return m;
    }
    return null;
  }
  for (const [k, v] of Object.entries(doc.fields || {})) obj[k] = parseVal(v);
  return obj;
}
function _fsToVal(val) {
  if (val === null || val === undefined) return { nullValue: null };
  if (typeof val === 'boolean') return { booleanValue: val };
  if (typeof val === 'number') return Number.isInteger(val) ? { integerValue: String(val) } : { doubleValue: val };
  if (typeof val === 'string') return { stringValue: val };
  if (val instanceof Date) return { timestampValue: val.toISOString() };
  if (typeof val === 'object') return { mapValue: { fields: Object.fromEntries(Object.entries(val).map(([k, v]) => [k, _fsToVal(v)])) } };
  return { stringValue: String(val) };
}
const _fsBase = () => `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents`;
async function _fsQuery(coll, token) {
  const r = await fetch(`${_fsBase()}:runQuery`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ structuredQuery: { from: [{ collectionId: coll }],
      orderBy: [{ field: { fieldPath: coll === 'reservations' ? 'createdAt' : 'nombre' }, direction: coll === 'reservations' ? 'DESCENDING' : 'ASCENDING' }], limit: 500 } })
  });
  const data = await r.json();
  return Array.isArray(data) ? data.filter(d => d.document).map(d => _fsDocToObj(d.document)) : [];
}
async function _fsUpdate(coll, docId, fields, token) {
  const mask = Object.keys(fields).map(f => `updateMask.fieldPaths=${encodeURIComponent(f)}`).join('&');
  await fetch(`${_fsBase()}/${coll}/${docId}?${mask}`, {
    method: 'PATCH',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields: Object.fromEntries(Object.entries(fields).map(([k, v]) => [k, _fsToVal(v)])) })
  });
}
async function _fsAdd(coll, data, token) {
  const r = await fetch(`${_fsBase()}/${coll}`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields: Object.fromEntries(Object.entries(data).map(([k, v]) => [k, _fsToVal(v)])) })
  });
  return ((await r.json()).name || '').split('/').pop();
}
async function _fsDel(coll, docId, token) {
  await fetch(`${_fsBase()}/${coll}/${docId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
}

// Unified wrappers — dispatch to SDK or REST depending on auth mode
async function dbUpdate(coll, docId, fields) {
  if (window._restMode) { await _fsUpdate(coll, docId, fields, window._fbToken); await _restRefresh(); }
  else await updateDoc(doc(db, coll, docId), fields);
}
async function dbAdd(coll, data) {
  if (window._restMode) { return await _fsAdd(coll, data, window._fbToken); }
  else { const ref = await addDoc(collection(db, coll), data); return ref.id; }
}
async function dbDel(coll, docId) {
  if (window._restMode) { await _fsDel(coll, docId, window._fbToken); await _restRefresh(); }
  else await deleteDoc(doc(db, coll, docId));
}

let _restPoll = null;
async function _restRefresh() {
  const token = window._fbToken;
  if (!token) return;
  try {
    const [resArr, drvArr] = await Promise.all([
      fetch(`${_fsBase()}:runQuery`, { method:'POST', headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
        body: JSON.stringify({ structuredQuery:{ from:[{collectionId:'reservations'}], orderBy:[{field:{fieldPath:'createdAt'},direction:'DESCENDING'}], limit:500 }}) })
        .then(r => r.json()).then(d => Array.isArray(d) ? d.filter(x => x.document).map(x => _fsDocToObj(x.document)) : []),
      fetch(`${_fsBase()}/drivers`, { headers:{'Authorization':`Bearer ${token}`} })
        .then(r => r.json()).then(d => (d.documents || []).map(_fsDocToObj)),
    ]);
    reservations = {};  resArr.forEach(r => { reservations[r.id] = r; });
    drivers = {};       drvArr.forEach(d => { drivers[d.id] = d; });
    renderReservations(); updateBadges(); renderDrivers();
    if (selectedId && reservations[selectedId]) renderDetail(reservations[selectedId]);
  } catch (e) { console.error('REST refresh error:', e); }
}
function startListenersREST(idToken) {
  window._fbToken  = idToken;
  window._restMode = true;
  _restRefresh();
  _restPoll = setInterval(_restRefresh, 30000);
}

// ── Firestore listeners ────────────────────────────────────────────────────
function startListeners() {
  const q = query(collection(db, 'reservations'), orderBy('createdAt', 'desc'));
  unsubReservations = onSnapshot(q,
    (snap) => {
      reservations = {};
      snap.forEach(d => { reservations[d.id] = { id: d.id, ...d.data() }; });
      renderReservations();
      updateBadges();
      if (selectedId && reservations[selectedId]) renderDetail(reservations[selectedId]);
    },
    (err) => {
      console.error('Firestore reservations error:', err.code, err.message);
      el('reservations-list').innerHTML = `<div class="empty-state"><p>Error Firestore: ${err.code || err.message}</p></div>`;
    }
  );

  unsubDrivers = onSnapshot(collection(db, 'drivers'),
    (snap) => {
      drivers = {};
      snap.forEach(d => { drivers[d.id] = { id: d.id, ...d.data() }; });
      renderDrivers();
      if (selectedId) renderDetail(reservations[selectedId]);
    },
    (err) => console.error('Firestore drivers error:', err.code, err.message)
  );
}

function stopListeners() {
  unsubReservations?.(); unsubDrivers?.();
  reservations = {}; drivers = {};
}

// ── Status tabs ────────────────────────────────────────────────────────────
document.querySelectorAll('.status-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentStatus = tab.dataset.status;
    renderReservations();
  });
});

function updateBadges() {
  const counts = { pending: 0, confirmed: 0, completed: 0, cancelled: 0 };
  Object.values(reservations).forEach(r => { if (counts[r.status] != null) counts[r.status]++; });
  for (const [k, n] of Object.entries(counts)) {
    const b = el(`badge-${k}`);
    if (b) b.textContent = n;
  }
}

// ── Render reservations ────────────────────────────────────────────────────
function renderReservations() {
  const list   = el('reservations-list');
  const items  = Object.values(reservations).filter(r => r.status === currentStatus);

  if (!items.length) {
    list.innerHTML = `
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <p>Sin reservas ${statusLabel[currentStatus]?.toLowerCase() ?? ''}</p>
      </div>`;
    return;
  }

  list.innerHTML = items.map(r => {
    const precio = r.cotizacion?.total != null ? fmt(r.cotizacion.total) : (r.cotizacion?.precio != null ? fmt(r.cotizacion.precio) : '');
    const driverLine = r.driverName ? `<div class="res-card__driver">🚗 ${r.driverName}</div>` : '';
    const origen  = (r.origen  || '').split(',')[0];
    const destino = (r.destino || '').split(',')[0];
    return `
      <div class="res-card" data-id="${r.id}">
        <div>
          <div class="res-card__name">${r.nombre || 'Sin nombre'}</div>
          <div class="res-card__datetime">${fmtDate(r.fecha, r.hora)}</div>
          <div class="res-card__route">
            <span style="overflow:hidden;text-overflow:ellipsis">${origen}</span>
            <span class="res-card__route-arrow">→</span>
            <span style="overflow:hidden;text-overflow:ellipsis">${destino}</span>
          </div>
          ${driverLine}
        </div>
        <div class="res-card__right">
          <span class="status-badge status-badge--${r.status}">${statusLabel[r.status]}</span>
          ${precio ? `<span class="res-card__price">${precio}</span>` : ''}
        </div>
      </div>`;
  }).join('');

  list.querySelectorAll('.res-card').forEach(card => {
    card.addEventListener('click', () => openDetail(card.dataset.id));
  });
}

// ── Detail panel ───────────────────────────────────────────────────────────
function openDetail(id) {
  selectedId = id;
  renderDetail(reservations[id]);
  el('detail-overlay').classList.add('open');
  el('detail-panel').classList.add('open');
}

function closeDetail() {
  el('detail-overlay').classList.remove('open');
  el('detail-panel').classList.remove('open');
  selectedId = null;
}

el('detail-close').addEventListener('click', closeDetail);
el('detail-overlay').addEventListener('click', closeDetail);

function renderDetail(r) {
  if (!r) return;
  const body = el('detail-body');
  const precio = r.cotizacion?.total != null ? fmt(r.cotizacion.total) : null;
  const dist   = r.cotizacion?.distanciaKm ? `${r.cotizacion.distanciaKm} km` : null;

  // Driver options
  const driverOptions = Object.values(drivers)
    .filter(d => d.activo !== false)
    .map(d => `<option value="${d.id}" ${r.driverId === d.id ? 'selected' : ''}>${d.nombre}</option>`)
    .join('');

  // Actions by status
  let actionsHtml = '';
  if (r.status === 'pending') {
    actionsHtml = `
      <div class="detail-section">
        <p class="action-label">Asignar chofer (opcional)</p>
        <select class="driver-select" id="detail-driver-select">
          <option value="">Sin asignar</option>
          ${driverOptions}
        </select>
      </div>
      <div class="detail-actions">
        <div class="row">
          <button class="btn-primary" id="action-confirm">✓ Confirmar reserva</button>
          <button class="btn-danger" id="action-cancel">Cancelar</button>
        </div>
      </div>`;
  } else if (r.status === 'confirmed') {
    actionsHtml = `
      <div class="detail-section">
        <p class="action-label">Chofer asignado</p>
        <select class="driver-select" id="detail-driver-select">
          <option value="">Sin asignar</option>
          ${driverOptions}
        </select>
        <button class="btn-secondary" id="action-assign" style="margin-top:8px;width:100%">Actualizar chofer</button>
      </div>
      <div class="detail-actions">
        <div class="row">
          <button class="btn-primary" id="action-complete">✓ Marcar completado</button>
          <button class="btn-danger" id="action-cancel">Cancelar</button>
        </div>
      </div>`;
  }

  body.innerHTML = `
    <div class="detail-header-info">
      <div class="detail-name">${r.nombre || 'Sin nombre'}</div>
      <div class="detail-meta">
        <span class="status-badge status-badge--${r.status}">${statusLabel[r.status]}</span>
        <span>${fmtDate(r.fecha, r.hora)}</span>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-section__title">Viaje</div>
      <div class="detail-row"><span class="detail-row__label">Origen</span><span class="detail-row__value">${r.origen || '—'}</span></div>
      <div class="detail-row"><span class="detail-row__label">Destino</span><span class="detail-row__value">${r.destino || '—'}</span></div>
      ${dist ? `<div class="detail-row"><span class="detail-row__label">Distancia</span><span class="detail-row__value">${dist}</span></div>` : ''}
      <div class="detail-row"><span class="detail-row__label">Paradas</span><span class="detail-row__value">${r.paradas || '0'}</span></div>
      <div class="detail-row"><span class="detail-row__label">Tipo</span><span class="detail-row__value">${r.tipoServicio || '—'}</span></div>
      ${r.comentarios ? `<div class="detail-row"><span class="detail-row__label">Comentarios</span><span class="detail-row__value">${r.comentarios}</span></div>` : ''}
    </div>

    <div class="detail-section">
      <div class="detail-section__title">Cliente</div>
      <div class="detail-row"><span class="detail-row__label">Email</span><span class="detail-row__value">${r.email || '—'}</span></div>
      <div class="detail-row"><span class="detail-row__label">Teléfono</span><span class="detail-row__value">${r.telefono || '—'}</span></div>
    </div>

    ${precio ? `
    <div class="detail-section">
      <div class="detail-section__title">Precio</div>
      ${r.cotizacion?.base    != null ? `<div class="detail-row"><span class="detail-row__label">Base</span><span class="detail-row__value">${fmt(r.cotizacion.base)}</span></div>` : ''}
      ${r.cotizacion?.costoParadas != null && r.cotizacion.costoParadas > 0 ? `<div class="detail-row"><span class="detail-row__label">Paradas</span><span class="detail-row__value">+ ${fmt(r.cotizacion.costoParadas)}</span></div>` : ''}
      ${r.cotizacion?.descuento   != null && r.cotizacion.descuento > 0    ? `<div class="detail-row"><span class="detail-row__label">Descuento</span><span class="detail-row__value">− ${fmt(r.cotizacion.descuento)}</span></div>` : ''}
      <div class="detail-row"><span class="detail-row__label">Total estimado</span><span class="detail-row__value detail-row__value--gold">${precio}</span></div>
    </div>` : ''}

    ${actionsHtml}`;

  // Wire up action buttons
  el('action-confirm')?.addEventListener('click', async () => {
    const dId = el('detail-driver-select')?.value || '';
    const driver = dId ? drivers[dId] : null;
    await dbUpdate('reservations', r.id, {
      status: 'confirmed',
      driverId:   driver?.id     || null,
      driverName: driver?.nombre || null,
    });
  });

  el('action-assign')?.addEventListener('click', async () => {
    const dId = el('detail-driver-select')?.value || '';
    const driver = dId ? drivers[dId] : null;
    await dbUpdate('reservations', r.id, {
      driverId:   driver?.id     || null,
      driverName: driver?.nombre || null,
    });
  });

  el('action-complete')?.addEventListener('click', async () => {
    await dbUpdate('reservations', r.id, { status: 'completed' });
  });

  el('action-cancel')?.addEventListener('click', async () => {
    if (!confirm('¿Cancelar esta reserva?')) return;
    await dbUpdate('reservations', r.id, { status: 'cancelled', driverId: null, driverName: null });
  });
}

// ── Drivers ────────────────────────────────────────────────────────────────
el('add-driver-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nombre = el('driver-name-input').value.trim();
  if (!nombre) return;
  await dbAdd('drivers', {
    nombre,
    telefono: el('driver-phone-input').value.trim(),
    activo:   true,
  });
  el('driver-name-input').value  = '';
  el('driver-phone-input').value = '';
});

function renderDrivers() {
  const list = el('drivers-list');
  const items = Object.values(drivers).sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
  if (!items.length) {
    list.innerHTML = `<div class="empty-state"><p>Aún no hay choferes registrados.</p></div>`;
    return;
  }
  list.innerHTML = items.map(d => `
    <div class="driver-item">
      <div class="driver-avatar">${(d.nombre || '?')[0].toUpperCase()}</div>
      <div class="driver-info">
        <div class="driver-name">${d.nombre}</div>
        ${d.telefono ? `<div class="driver-phone">${d.telefono}</div>` : ''}
      </div>
      <button class="driver-toggle driver-toggle--${d.activo !== false ? 'active' : 'inactive'}" data-id="${d.id}">
        ${d.activo !== false ? 'Activo' : 'Inactivo'}
      </button>
      <button class="driver-delete" data-id="${d.id}" title="Eliminar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>
    </div>`).join('');

  list.querySelectorAll('.driver-toggle').forEach(btn => {
    btn.addEventListener('click', async () => {
      const d = drivers[btn.dataset.id];
      if (d) await dbUpdate('drivers', btn.dataset.id, { activo: !d.activo });
    });
  });
  list.querySelectorAll('.driver-delete').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('¿Eliminar este chofer?')) return;
      await dbDel('drivers', btn.dataset.id);
    });
  });
}
</script>
</body>
</html>
