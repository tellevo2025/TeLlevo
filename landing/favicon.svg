<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#F0C040"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>
  <!-- Fondo azul oscuro circular -->
  <circle cx="50" cy="50" r="50" fill="#0A1628"/>
  <!-- Aro exterior del volante -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <!-- Rayos: superior-izquierda, superior-derecha, abajo -->
  <line x1="50" y1="50" x2="18" y2="26" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="82" y2="26" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50" y2="88" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Hub central -->
  <circle cx="50" cy="50" r="7" fill="url(#gold)"/>
</svg>
